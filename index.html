<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PA#2 (Variant 18)</title>

  <style>
    body { background-color: #EEEEEE; font-family: Arial, sans-serif; }
    .panel {
      width: 600px;
      margin: 10px 0;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
    }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .row label { width: 120px; }
    input[type="range"] { width: 320px; }
    #canvas-holder { width: 600px; }
  </style>

  <script src="./Utils/trackball-rotator.js"></script>
  <script src="./Utils/m4.js"></script>
  <script src="./shader.gpu"></script>
  <script src="./main.js"></script>
</head>

<body onload="init()">
  <h2>PA#2 — Surface (Variant 18)</h2>
  <p id="message">
    Drag mouse to rotate.<br>
    Use sliders to change U/V tessellation (granularity).
  </p>

  <div class="panel">
    <div class="row">
      <label for="uSlider">U segments:</label>
      <input id="uSlider" type="range" min="5" max="200" value="35" />
      <span id="uVal">35</span>
    </div>

    <div class="row">
      <label for="vSlider">V segments:</label>
      <input id="vSlider" type="range" min="5" max="200" value="45" />
      <span id="vVal">45</span>
    </div>
  </div>

  <div id="canvas-holder">
    <canvas width="600" height="600" id="webglcanvas" style="background-color: black"></canvas>
  </div>
</body>
</html>
